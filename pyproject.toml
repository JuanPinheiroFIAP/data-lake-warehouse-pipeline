[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "JuanPinheiroFIAP",email = "rm552202@fiap.com.br"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "fastparquet (>=2026.5.0,<2027.0.0)",
    "boto3 (>=1.43.53,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "faker (>=40.0.0,<41.0.0)",
    "psycopg[binary] (>=3.2.0,<4.0.0)"
]

[tool.poetry]
packages = [{include = "app", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.15.21,<0.16.0)"
]
